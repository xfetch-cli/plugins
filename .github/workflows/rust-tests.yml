name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CI (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash ci/unix.sh
      - name: CI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/windows.ps1
