[package]
name = "xfetch-plugin-theme-detection"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Xfetch plugin that detects the system color theme (GTK/KDE Plasma)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xfetch-plugin-api = { workspace = true }
