[package]
name = "xfetch-plugin-langs"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Xfetch plugin that shows the languages of a repository or an org/user with glyphs and brand colors"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xfetch-plugin-api = { workspace = true }
